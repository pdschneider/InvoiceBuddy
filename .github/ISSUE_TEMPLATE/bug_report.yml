name: "🐛 Bug Report"
description: "Report a bug."
labels: ["Type/Bug"]
body:
  - type: markdown
    attributes:
      value: |
        > If your issue was closed but not fully resolved, please **reopen** it or **create a new issue**.

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear text description of the bug."
      placeholder: |
        e.g. When I click the auto-name button, nothing is changed.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Enter '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "App Version, OS, etc."
      placeholder: |
        - Version: [e.g. v0.3.0]
        - OS: [e.g. Linux Mint 22 // Windows 11]
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Any other relevant information. Error messages, log output, screenshots, etc."
    validations:
      required: false
